<%inherit file="base.html"/>
<%!
    import mylar
%>

<%def name="body()">
    <input type="hidden" id="page_name" value="history" />
    <div class="page">
        <div class="page-head">
            <div class="head-text">
                <h1><span class="page-crumb">Downloads › </span>History</h1>
                <p class="page-sub">Everything Issuarr has grabbed, from every source, and what became of it.</p>
            </div>
            <details class="menu" id="h-clear-menu">
                <summary class="btn">Clear history…</summary>
                <div class="menu-list">
                    <button type="button" class="btn btn-ghost" data-clear="Snatched">Clear snatched</button>
                    <button type="button" class="btn btn-ghost" data-clear="Processed">Clear processed</button>
                    <button type="button" class="btn btn-ghost" data-clear="Unprocessed">Clear unprocessed</button>
                    <hr />
                    <button type="button" class="btn btn-ghost" data-clear="all">Clear all history</button>
                    <button type="button" class="btn btn-ghost" data-wipe-nzblog title="Forget which issue each grabbed download belongs to">Clear the download log…</button>
                </div>
            </details>
        </div>

        <section class="section" aria-label="History">
            <div class="section-head" style="align-items: flex-end">
                <div class="filter-tabs" role="group" aria-label="Show" id="h-tabs"></div>
                <label class="nowrap" style="display: flex; align-items: center; gap: 8px">
                    <span class="sr-only">Filter by series, issue or date</span>
                    <input type="search" id="h-search" placeholder="Filter by series, issue or date" style="min-height: 38px; padding: 0 10px; width: 260px; max-width: 100%" />
                </label>
            </div>

            <div class="bulk-bar" id="h-bulk" hidden>
                <span class="bulk-count" id="h-bulk-count"></span>
                <button type="button" class="btn btn-sm" data-bulk="Retry">Search again</button>
                <button type="button" class="btn btn-sm" data-bulk="Clear">Clear from history</button>
                <button type="button" class="btn btn-sm btn-ghost" id="h-bulk-none">Clear selection</button>
            </div>

            <div class="dt-wrap">
                <table class="dt" id="h-table">
                    <thead>
                        <tr>
                            <th scope="col" class="check"><input type="checkbox" id="h-all" aria-label="Select all on this page" /></th>
                            <th scope="col">Added</th>
                            <th scope="col">Series</th>
                            <th scope="col">Issue</th>
                            <th scope="col">Status</th>
                            <th scope="col">Provider</th>
                            <th scope="col"><span class="sr-only">Actions</span></th>
                        </tr>
                    </thead>
                    <tbody><tr><td colspan="7" class="empty-state">Loading…</td></tr></tbody>
                </table>
            </div>
            <div class="btn-row" style="justify-content: space-between">
                <span class="muted" id="h-range"></span>
                <span class="btn-row">
                    <label class="muted nowrap">Per page
                        <select id="h-len" style="min-height: 34px; margin-left: 6px"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
                    </label>
                    <button type="button" class="btn btn-sm" id="h-prev">Previous</button>
                    <button type="button" class="btn btn-sm" id="h-next">Next</button>
                </span>
            </div>
        </section>
    </div>
</%def>

<%def name="javascriptIncludes()">
    <script src="js/history.js?v=${mylar.CURRENT_VERSION}"></script>
</%def>
