<%inherit file="base.html"/>
<%!
    import mylar
%>

<%def name="body()">
    <input type="hidden" id="page_name" value="index" />
    <div class="page library">
        <div class="page-head">
            <div class="head-text">
                <h1>Library</h1>
                <div class="lib-sub">
                    <p class="page-sub mono" id="lib-stats">&nbsp;</p>
                    <span class="legend" aria-hidden="true"><span><i class="is-have"></i>On disk</span><span><i class="is-wanted"></i>Wanted</span><span><i></i>Missing</span></span>
                </div>
            </div>
            <div class="btn-row">
                <button type="button" class="btn" id="lib-select" aria-pressed="false">Select</button>
                <a class="btn" href="manage#tabs-1">Scan folders</a>
                <button type="button" class="btn btn-primary" data-action="add">Add series</button>
                <details class="menu" id="lib-more">
                    <summary class="btn" aria-label="More library actions" title="More">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>
                    </summary>
                    <div class="menu-list">
                        <button type="button" class="btn btn-ghost" data-export="Wanted">Save wanted list as CSV (data folder)</button>
                        <button type="button" class="btn btn-ghost" data-export="Downloaded">Save downloaded list as CSV (data folder)</button>
                        <hr />
                        <button type="button" class="btn btn-ghost" id="lib-update-all">Update every series from ComicVine</button>
                    </div>
                </details>
            </div>
        </div>

        <div class="filter-tabs" role="group" aria-label="Show" id="lib-tabs"></div>

        <div class="btn-row lib-tools">
            <label class="lib-search">
                <span class="sr-only">Filter by title</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                <input type="search" id="lib-q" data-ui placeholder="Filter by title" autocomplete="off" />
            </label>
            <label class="lib-field">Publisher <select id="lib-pub"><option value="">All</option></select></label>
            <label class="lib-field">Sort
                <select id="lib-sort">
                    <option value="title">Title</option>
                    <option value="updated">Recently updated</option>
                    <option value="year">Start year</option>
                    <option value="missing">Most missing</option>
                    <option value="publisher">Publisher</option>
                </select>
            </label>
            <div class="seg" role="group" aria-label="View">
                <button type="button" data-ui data-view="covers" aria-pressed="true">Covers</button>
                <button type="button" data-ui data-view="list" aria-pressed="false">List</button>
            </div>
        </div>

        <div class="bulk-bar" id="lib-bulk" hidden>
            <span class="bulk-count" id="lib-bulk-count"></span>
            <button type="button" class="btn btn-sm" data-bulk="refresh">Refresh from ComicVine</button>
            <button type="button" class="btn btn-sm" data-bulk="pause">Pause</button>
            <button type="button" class="btn btn-sm" data-bulk="resume">Resume</button>
            <button type="button" class="btn btn-sm" data-bulk="recheck">Recheck files</button>
            <button type="button" class="btn btn-sm" data-bulk="metatag">Write metadata</button>
            <button type="button" class="btn btn-sm" data-bulk="rename">Rename files</button>
            <button type="button" class="btn btn-sm btn-danger" data-bulk="delete">Remove…</button>
            <button type="button" class="btn btn-sm btn-ghost" id="lib-select-all">Select all shown</button>
        </div>

        <div id="lib-grid" class="cover-grid" aria-live="polite"></div>
        <div id="lib-list" class="dt-wrap" hidden>
            <table class="dt">
                <thead>
                    <tr>
                        <th scope="col" class="check lib-check-col"><span class="sr-only">Select</span></th>
                        <th scope="col">Series</th>
                        <th scope="col">Publisher</th>
                        <th scope="col">Year</th>
                        <th scope="col">Latest</th>
                        <th scope="col">Status</th>
                        <th scope="col" style="min-width: 220px">Issues</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="empty-state" id="lib-empty" hidden></div>
        <div class="btn-row" style="justify-content: center">
            <button type="button" class="btn" id="lib-more-rows" hidden>Show more</button>
        </div>
    </div>
</%def>

<%def name="javascriptIncludes()">
    <script src="js/library.js?v=${mylar.CURRENT_VERSION}"></script>
</%def>
