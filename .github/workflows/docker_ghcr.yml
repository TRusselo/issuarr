# Build the LSIO-compatible image from this repo and publish it to GHCR
name: Build & Publish Docker Image

on:
    push:
        branches:
            - 'main'
    workflow_dispatch:

concurrency:
    group: docker-${{ github.ref }}
    cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: issuarr/issuarr

jobs:
    build_and_push:
        name: Build, test and push to GHCR
        runs-on: ubuntu-latest
        permissions:
          contents: read
          packages: write
        steps:
          - name: Checkout
            uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Log in to the Container registry
            uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
            with:
              registry: ${{ env.REGISTRY }}
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Extract metadata (tags, labels) for Docker
            id: meta
            uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
            with:
              images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
              tags: |
                type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
                type=ref,event=branch
                type=sha,format=short,prefix=

          - name: Build image for testing
            uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
            with:
              context: .
              platforms: linux/amd64
              load: true
              tags: issuarr:test
              build-args: |
                BUILD_DATE=${{ github.event.head_commit.timestamp }}
                VERSION=${{ github.sha }}
                MYLAR3_BRANCH=${{ github.ref_name }}
                MYLAR3_COMMIT=${{ github.sha }}
              cache-from: type=gha
              cache-to: type=gha,mode=max

          - name: Test image
            shell: bash
            run: |
              set -euo pipefail
              docker run --rm --entrypoint /lsiopy/bin/python3 issuarr:test -c "from PIL import features, Image; print('Pillow', Image.__version__); assert features.check('webp'), 'Pillow lacks WebP support'"
              docker run --rm --entrypoint /usr/bin/unrar issuarr:test > /tmp/unrar.txt || true
              grep -i "^UNRAR [0-9]" /tmp/unrar.txt
              mkdir -p /tmp/cfg && sudo chown 1000:1000 /tmp/cfg
              docker run -d --name issuarr -e PUID=1000 -e PGID=1000 -e TZ=America/Denver -p 8090:8090 -v /tmp/cfg:/config issuarr:test
              if ! curl -sS -o /dev/null --retry 30 --retry-delay 5 --retry-all-errors --fail http://127.0.0.1:8090/home; then docker logs issuarr; exit 1; fi
              for page in manage config importResults import_progress; do curl -sS -o /dev/null --fail http://127.0.0.1:8090/$page; done
              curl -sS --fail http://127.0.0.1:8090/import_progress | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['phase'] == 'idle', d"
              test -f /tmp/cfg/mylar/config.ini
              test -f /tmp/cfg/scripts/autoProcessComics.py
              docker exec issuarr cat /app/mylar3/.LAST_RELEASE
              docker logs issuarr 2>&1 | tail -n 40
              docker rm -f issuarr

          - name: Push image
            uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
            with:
              context: .
              platforms: linux/amd64
              push: true
              tags: ${{ steps.meta.outputs.tags }}
              labels: ${{ steps.meta.outputs.labels }}
              build-args: |
                BUILD_DATE=${{ github.event.head_commit.timestamp }}
                VERSION=${{ github.sha }}
                MYLAR3_BRANCH=${{ github.ref_name }}
                MYLAR3_COMMIT=${{ github.sha }}
              cache-from: type=gha
